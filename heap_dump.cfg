buffers {
    size_kb: 510000 # https://b.corp.google.com/issues/436802463#comment64
    fill_policy: DISCARD
}
guardrail_overrides {
    max_tracing_buffer_size_kb: 512000
}

duration_ms: 1000
data_sources {
    config {
        name: "android.java_hprof"
        java_hprof_config {
            process_cmdline: "system_server"
        }
    }
}

unique_session_name: "pmgd_heap_dump"

compression_type: COMPRESSION_TYPE_DEFLATE

trace_uuid_lsb: 436802463
trace_uuid_msb: TARGET_MSB

android_report_config {
    reporter_service_package: "com.google.android.gms"
    reporter_service_class: "com.google.android.gms.westworld.perfetto.PerfettoReportService"
}